<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WakeUpMarshall</title>
<style>
  :root {
    --bg: #101014; --card: #1a1a21; --card2: #22222b; --border: #2e2e3a;
    --text: #e8e8ee; --muted: #8a8a99; --accent: #ffb454; --green: #3ddc84;
    --blue: #5ab0ff; --red: #ff6b6b; --orange: #ffa94d; --gray: #6c6c78;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
         padding: 20px; max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 600; }
  .logo { font-size: 22px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
          border-radius: 999px; font-size: 12px; border: 1px solid var(--border); background: var(--card2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
  .dot.ok { background: var(--green); } .dot.bad { background: var(--red); } .dot.warn { background: var(--orange); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 12px;
             text-transform: uppercase; letter-spacing: .04em; }
  .card.wide { grid-column: 1 / -1; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
         padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .row:last-child { border-bottom: none; }
  .muted { color: var(--muted); font-size: 12px; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  .badge { padding: 2px 8px; border-radius: 6px; font-size: 11px; border: 1px solid var(--border); background: var(--card2); }
  .badge.green { color: var(--green); border-color: var(--green); }
  .badge.blue  { color: var(--blue);  border-color: var(--blue); }
  .badge.red   { color: var(--red);   border-color: var(--red); }
  .badge.orange{ color: var(--orange);border-color: var(--orange); }
  .badge.gray  { color: var(--gray);  border-color: var(--gray); }
  button { background: var(--card2); color: var(--text); border: 1px solid var(--border);
           border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1a10; border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--red); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=number] { background: var(--card2); color: var(--text); border: 1px solid var(--border);
                       border-radius: 8px; padding: 6px 10px; width: 90px; font-size: 13px; }
  /* toggle switch */
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--gray); border-radius: 24px;
            transition: .2s; cursor: pointer; }
  .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
                    background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .kv:last-child { border-bottom: none; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
           background: var(--card2); border: 1px solid var(--border); padding: 9px 16px;
           border-radius: 10px; display: none; z-index: 9; font-size: 13px; }
  .dev { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .dev:last-child { border-bottom: none; }
  .dev .info { flex: 1; min-width: 0; }
  .dev .name { font-weight: 600; }
  .operation { display: none; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px;
               border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--border));
               border-radius: 9px; background: color-mix(in srgb, var(--accent) 8%, var(--card2)); }
  .spinner { width: 17px; height: 17px; flex: 0 0 auto; border: 2px solid var(--border);
             border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cap-note { margin-top: 10px; padding: 9px 10px; border-radius: 8px; background: var(--card2);
              color: var(--muted); font-size: 11.5px; }
  .device-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .device-heading button { padding: 4px 9px; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<header>
  <span class="logo">🎵</span>
  <h1>WakeUpMarshall</h1>
  <span class="chip"><span id="adapter-dot" class="dot"></span><span id="adapter-text">读取中…</span></span>
  <span class="chip" id="operation-chip" style="display:none"><span class="spinner"></span><span id="operation-chip-text"></span></span>
  <span class="chip muted" id="ver"></span>
</header>

<div class="grid">
  <!-- scheduler -->
  <div class="card">
    <h2>定时唤醒</h2>
    <div class="row">
      <span>定时唤醒</span>
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span>唤醒间隔（分钟）</span>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="number" id="interval" min="1" max="1440" step="1">
        <button id="save-interval">保存</button>
      </div>
    </div>
    <div class="row"><span>下次唤醒</span><span class="mono" id="next-run">—</span></div>
    <div class="row"><span>最近一次唤醒</span><span id="last-wake">—</span></div>
    <div class="row"><span>执行结果</span><span id="last-result"><span class="badge gray">—</span></span></div>
    <div class="operation" id="operation-panel">
      <span class="spinner"></span>
      <div>
        <div id="operation-title" style="font-weight:600">正在执行</div>
        <div class="muted" id="operation-detail"></div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="wake-now">⚡ 立即唤醒</button>
      <button id="rescan">↻ 重新扫描</button>
    </div>
  </div>

  <!-- bluetooth -->
  <div class="card">
    <h2 class="device-heading">
      <span>蓝牙与设备</span>
      <button id="toggle-all-devices">显示全部设备</button>
    </h2>
    <div class="kv"><span class="muted">适配器</span><span class="mono" id="adapter-addr">—</span></div>
    <div class="kv"><span class="muted">已绑定设备</span><span id="saved-count">0</span></div>
    <div class="kv"><span class="muted">当前显示</span><span id="dev-count">0</span></div>
    <div id="devices" style="margin-top:4px"></div>
    <div class="cap-note" id="capability-note"></div>
  </div>

  <!-- history -->
  <div class="card wide">
    <h2 style="display:flex;justify-content:space-between;align-items:center">
      <span>唤醒历史</span>
      <span>
        <button id="refresh-history" style="margin-right:6px">刷新</button>
        <button id="clear-history">清空</button>
      </span>
    </h2>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>时间</th><th>模式</th><th>结果</th><th>耗时</th><th>详情</th></tr></thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
    <div id="history-empty" class="empty" style="display:none">暂无历史记录</div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const RESULT = {
  success:        ["成功", "green"],
  already_awake:  ["已唤醒", "blue"],
  failed:         ["失败", "red"],
  no_device:      ["未发现设备", "orange"],
  error:          ["错误", "red"],
  skipped:        ["跳过", "gray"],
  scan:           ["扫描", "gray"],
};
const MODE = { auto: "自动", manual: "手动" };
let statusCache = null;
let showAllDevices = false;
let devicesRenderKey = "";

async function api(path, opts) {
  const res = await fetch(path, opts);
  const payload = await res.json();
  if (!res.ok) throw new Error(payload.error || `请求失败 (${res.status})`);
  return payload;
}

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("zh-CN", { hour12: false });
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2200);
}

function renderStatus(st) {
  statusCache = st;
  document.getElementById("ver").textContent = "v" + st.version;

  // adapter
  const dot = document.getElementById("adapter-dot");
  const txt = document.getElementById("adapter-text");
  const addr = document.getElementById("adapter-addr");
  if (!st.adapter.checked) { dot.className = "dot warn"; txt.textContent = "蓝牙状态待检测"; }
  else if (!st.adapter.present) { dot.className = "dot bad"; txt.textContent = "无蓝牙适配器"; }
  else if (st.adapter.powered) { dot.className = "dot ok"; txt.textContent = "蓝牙已开启"; }
  else { dot.className = "dot bad"; txt.textContent = "蓝牙已关闭"; }
  addr.textContent = st.adapter.address || (st.adapter.name || "—");

  // scheduler
  const s = st.scheduler;
  document.getElementById("enabled").checked = s.enabled;
  document.getElementById("interval").value = s.interval_minutes;
  document.getElementById("next-run").textContent = fmtTime(s.next_run);

  const lw = s.last_wake;
  document.getElementById("last-wake").textContent = lw ? fmtTime(lw.ts) : "—";
  const r = lw ? (RESULT[lw.result] || [lw.result, "gray"]) : ["—", "gray"];
  document.getElementById("last-result").innerHTML =
    `<span class="badge ${r[1]}">${r[0]}</span>`;

  const operation = s.operation || {};
  const operationActive = s.working && operation.phase !== "idle";
  const operationName = operation.kind === "scan" ? "正在扫描" : "正在唤醒";
  const progress = operation.total
    ? `（${operation.current || 0}/${operation.total}）`
    : "";
  const operationPanel = document.getElementById("operation-panel");
  const operationChip = document.getElementById("operation-chip");
  operationPanel.style.display = operationActive ? "flex" : "none";
  operationChip.style.display = operationActive ? "inline-flex" : "none";
  document.getElementById("operation-title").textContent = operationName + progress;
  document.getElementById("operation-detail").textContent = operation.detail || "正在处理蓝牙请求";
  document.getElementById("operation-chip-text").textContent = operationName;

  document.getElementById("wake-now").disabled = s.working;
  document.getElementById("rescan").disabled = s.working;
  document.getElementById("wake-now").textContent =
    s.working && operation.kind === "wake" ? "⚡ 唤醒中…" : "⚡ 立即唤醒";
  document.getElementById("rescan").textContent =
    s.working && operation.kind === "scan" ? "↻ 扫描中…" : "↻ 重新扫描";

  // devices
  const box = document.getElementById("devices");
  const visible = showAllDevices
    ? st.devices
    : st.devices.filter(d => d.saved || d.is_marshall);
  document.getElementById("saved-count").textContent = st.saved_device_count || 0;
  document.getElementById("dev-count").textContent =
    showAllDevices ? `${visible.length} / ${st.devices.length}` : `${visible.length}`;
  document.getElementById("toggle-all-devices").textContent =
    showAllDevices ? "仅显示 Marshall" : "显示全部设备";
  const nextRenderKey = JSON.stringify([showAllDevices, visible]);
  if (nextRenderKey !== devicesRenderKey) {
    devicesRenderKey = nextRenderKey;
    if (!visible.length) {
      box.innerHTML = `<div class="muted" style="padding:6px 0">暂无设备（点击“重新扫描”）</div>`;
    } else {
      box.innerHTML = visible.map(d => `
        <div class="dev">
          <span class="dot ${d.connected ? "ok" : d.discovered ? "warn" : "gray"}"></span>
          <div class="info">
            <div class="name">${esc(d.name) || "(未命名)"}</div>
            <div class="mono muted">${esc(d.address)}</div>
            <div class="muted">${deviceStatusText(d)}</div>
          </div>
          ${d.audio_state === "active" ? '<span class="badge green">正在输出音频</span>' : ""}
          ${d.audio_state === "pending" || d.audio_state === "broadcasting" ? '<span class="badge orange">音频流待接管</span>' : ""}
          ${d.saved ? '<span class="badge blue">已绑定</span>' : ""}
          ${d.is_marshall ? '<span class="badge orange">Marshall</span>' : ""}
          ${d.connected ? '<span class="badge green">已连接</span>' : ""}
          ${d.paired ? '<span class="badge blue">已配对</span>' : ""}
          ${d.is_marshall && !d.saved && d.discovered
            ? `<button data-action="bind" data-address="${escAttr(d.address)}">绑定</button>`
            : ""}
          ${d.saved
            ? `<button class="danger" data-action="unbind" data-address="${escAttr(d.address)}">删除</button>`
            : ""}
        </div>`).join("");
    }
  }

  const capabilities = st.capabilities || {};
  const connectionText = capabilities.connection_state
    ? "连接状态每 5 秒刷新"
    : "连接状态仅在扫描/唤醒时更新";
  const audioText = capabilities.audio_state
    ? "Linux BlueZ A2DP 音频流状态可实时读取"
    : "此后端无法读取 A2DP 音频流";
  document.getElementById("capability-note").textContent =
    `${connectionText}；${audioText}。蓝牙无法可靠区分休眠、关机、离线或超出范围。`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function escAttr(s) {
  return esc(s).replace(/`/g, "&#96;");
}

function deviceStatusText(device) {
  const seen = device.last_seen ? `最近发现：${fmtTime(device.last_seen)}` : "尚未发现";
  if (device.connected) return `已建立蓝牙连接 · ${seen}`;
  if (device.discovered) return `本次扫描可见 · ${seen}`;
  if (device.saved) return `已保存但当前不可见；可能休眠、关机、离线或超出范围 · ${seen}`;
  return seen;
}

async function refreshStatus() {
  try {
    const st = await api("/api/status");
    renderStatus(st);
  } catch (e) { /* server may be restarting */ }
}

async function refreshHistory() {
  try {
    const data = await api("/api/history");
    const body = document.getElementById("history-body");
    const empty = document.getElementById("history-empty");
    const rows = data.history || [];
    body.innerHTML = "";
    empty.style.display = rows.length ? "none" : "block";
    rows.forEach(h => {
      const r = RESULT[h.result] || [h.result, "gray"];
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="muted">${fmtTime(h.ts)}</td>
        <td>${MODE[h.mode] || h.mode}${h.action === "scan" ? " / 扫描" : ""}</td>
        <td><span class="badge ${r[1]}">${r[0]}</span></td>
        <td class="muted">${h.duration_ms ? h.duration_ms + " ms" : "—"}</td>
        <td>${esc(h.detail || "")}</td>`;
      body.appendChild(tr);
    });
  } catch (e) {}
}

// ---- events ----
document.getElementById("enabled").addEventListener("change", async (e) => {
  await api("/api/settings", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enabled: e.target.checked })
  });
  toast(e.target.checked ? "定时唤醒已开启" : "定时唤醒已关闭");
  refreshStatus();
});

document.getElementById("save-interval").addEventListener("click", async () => {
  const v = parseInt(document.getElementById("interval").value, 10);
  if (!v || v < 1) { toast("间隔至少为 1 分钟"); return; }
  await api("/api/settings", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ interval_minutes: v })
  });
  toast("唤醒间隔已更新");
  refreshStatus();
});

document.getElementById("wake-now").addEventListener("click", async () => {
  try {
    const data = await api("/api/wake", { method: "POST" });
    renderQueuedOperation(data.operation);
    toast("唤醒请求已发出");
    refreshStatus();
  } catch (error) {
    toast(error.message);
  }
});

document.getElementById("rescan").addEventListener("click", async () => {
  try {
    const data = await api("/api/scan", { method: "POST" });
    renderQueuedOperation(data.operation);
    toast("扫描请求已发出");
    refreshStatus();
  } catch (error) {
    toast(error.message);
  }
});

function renderQueuedOperation(operation) {
  if (!statusCache) return;
  statusCache.scheduler.working = true;
  statusCache.scheduler.operation = operation;
  renderStatus(statusCache);
}

document.getElementById("toggle-all-devices").addEventListener("click", () => {
  showAllDevices = !showAllDevices;
  if (statusCache) renderStatus(statusCache);
});

document.getElementById("devices").addEventListener("click", async event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const address = button.dataset.address;
  button.disabled = true;
  try {
    if (button.dataset.action === "bind") {
      await api("/api/devices/bind", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ address }),
      });
      toast("设备已绑定，后续唤醒将直接连接");
    } else if (confirm("确定删除该设备的绑定信息？")) {
      await api(`/api/devices/${encodeURIComponent(address)}`, { method: "DELETE" });
      toast("绑定已删除，可重新扫描并绑定");
    }
    await refreshStatus();
  } catch (error) {
    toast(error.message);
    button.disabled = false;
  }
});

document.getElementById("refresh-history").addEventListener("click", refreshHistory);
document.getElementById("clear-history").addEventListener("click", async () => {
  if (!confirm("确定清空全部历史记录？")) return;
  await api("/api/history", { method: "DELETE" });
  toast("历史已清空");
  refreshHistory();
});

// ---- boot ----
refreshStatus();
refreshHistory();
setInterval(refreshStatus, 1500);
</script>
</body>
</html>
